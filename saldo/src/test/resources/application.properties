# Test configuration for saldo module
quarkus.grpc.server.test-port=0
quarkus.http.test-port=0

# Dev Services will auto-start a testcontainers PostgreSQL for tests
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
# Redis is provided by docker-compose or mocked via MockRedisService; never start DevServices
quarkus.redis.devservices.enabled=false
quarkus.redis.hosts=redis://localhost:6379

# Auto-create schema from entity definitions at startup
quarkus.hibernate-orm.database.generation=drop-and-create

# Disable OpenTelemetry exporter
quarkus.otel.exporter.otlp.enabled=false

# Logging
quarkus.log.level=WARN
quarkus.log.category."com.sanedge".level=INFO
