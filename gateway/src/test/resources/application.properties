# E2E Test configuration for gateway module
quarkus.http.test-port=0
quarkus.grpc.server.test-port=0

# PostgreSQL - connect to docker-compose test instance
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=test
quarkus.datasource.password=test
quarkus.datasource.reactive.url=postgresql://localhost:15432/testdb

# Redis - connect to docker-compose test instance
quarkus.redis.hosts=redis://dragon_knight@localhost:16379
quarkus.redis.client-type=standalone

# Auto-create schema from entity definitions at startup
quarkus.hibernate-orm.database.generation=drop-and-create

# Disable OpenTelemetry exporter for tests
quarkus.otel.exporter.otlp.enabled=false

# Disable gRPC clients - we mock the service layer
quarkus.grpc.clients.auth.host=localhost
quarkus.grpc.clients.auth.port=19012
quarkus.grpc.clients.user.host=localhost
quarkus.grpc.clients.user.port=19011
quarkus.grpc.clients.card.host=localhost
quarkus.grpc.clients.card.port=19004
quarkus.grpc.clients.merchant.host=localhost
quarkus.grpc.clients.merchant.port=19005
quarkus.grpc.clients.role.host=localhost
quarkus.grpc.clients.role.port=19006
quarkus.grpc.clients.saldo.host=localhost
quarkus.grpc.clients.saldo.port=19007
quarkus.grpc.clients.topup.host=localhost
quarkus.grpc.clients.topup.port=19008
quarkus.grpc.clients.transaction.host=localhost
quarkus.grpc.clients.transaction.port=19009
quarkus.grpc.clients.transfer.host=localhost
quarkus.grpc.clients.transfer.port=19010
quarkus.grpc.clients.withdraw.host=localhost
quarkus.grpc.clients.withdraw.port=19013

# JWT Configuration for tests - disable strict verification
quarkus.http.auth.enabled=false
quarkus.security.jaxrs.deny-unannotated=false

# Logging
quarkus.log.level=WARN
quarkus.log.category."com.sanedge".level=INFO
quarkus.log.category."io.quarkus".level=WARN
