apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: payment-gateway
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.payment-gateway.svc.cluster.local:9093']

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.payment-gateway.svc.cluster.local:8889']

      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['kafka-exporter.payment-gateway.svc.cluster.local:9308']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter.payment-gateway.svc.cluster.local:9100']

      - job_name: 'gateway-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['gateway.payment-gateway.svc.cluster.local:8080']
            labels:
              application: 'API Gateway'
              environment: 'production'

      - job_name: 'auth-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['auth.payment-gateway.svc.cluster.local:8092']
            labels:
              application: 'Auth Service'
              environment: 'production'

      - job_name: 'user-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['user.payment-gateway.svc.cluster.local:8091']
            labels:
              application: 'User Service'
              environment: 'production'

      - job_name: 'role-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['role.payment-gateway.svc.cluster.local:8086']
            labels:
              application: 'Role Service'
              environment: 'production'

      - job_name: 'card-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['card.payment-gateway.svc.cluster.local:8084']
            labels:
              application: 'Card Service'
              environment: 'production'

      - job_name: 'merchant-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['merchant.payment-gateway.svc.cluster.local:8085']
            labels:
              application: 'Merchant Service'
              environment: 'production'

      - job_name: 'saldo-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['saldo.payment-gateway.svc.cluster.local:8087']
            labels:
              application: 'Saldo Service'
              environment: 'production'

      - job_name: 'topup-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['topup.payment-gateway.svc.cluster.local:8088']
            labels:
              application: 'Topup Service'
              environment: 'production'

      - job_name: 'transaction-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['transaction.payment-gateway.svc.cluster.local:8089']
            labels:
              application: 'Transaction Service'
              environment: 'production'

      - job_name: 'transfer-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['transfer.payment-gateway.svc.cluster.local:8090']
            labels:
              application: 'Transfer Service'
              environment: 'production'

      - job_name: 'withdraw-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['withdraw.payment-gateway.svc.cluster.local:8093']
            labels:
              application: 'Withdraw Service'
              environment: 'production'

      - job_name: 'email-service'
        metrics_path: '/q/metrics'
        static_configs:
          - targets: ['email-service.payment-gateway.svc.cluster.local:8094']
            labels:
              application: 'Email Service'
              environment: 'production'
