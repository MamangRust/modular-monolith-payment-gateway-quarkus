apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: payment-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: payment-gateway-secrets
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # DB_USER/DB_PASS are the vars Quarkus services actually read
    # (quarkus.datasource.username=${DB_USER:DRAGON}, password=${DB_PASS:DRAGON}).
    # DB_USERNAME/DB_PASSWORD are kept for infra (postgres/pgbouncer) parity.
    - secretKey: DB_USER
      remoteRef:
        key: payment-gateway/DB_USER
    - secretKey: DB_PASS
      remoteRef:
        key: payment-gateway/DB_PASS
    - secretKey: DB_USERNAME
      remoteRef:
        key: payment-gateway/DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: payment-gateway/DB_PASSWORD
    - secretKey: POSTGRES_USER
      remoteRef:
        key: payment-gateway/POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: payment-gateway/POSTGRES_PASSWORD
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: payment-gateway/GF_SECURITY_ADMIN_PASSWORD
    - secretKey: SECRET_KEY
      remoteRef:
        key: payment-gateway/SECRET_KEY
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: payment-gateway/REDIS_PASSWORD
    - secretKey: SMTP_USER
      remoteRef:
        key: payment-gateway/SMTP_USER
    - secretKey: SMTP_PASS
      remoteRef:
        key: payment-gateway/SMTP_PASS
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: payment-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: payment-gateway-secrets
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: payment-gateway/GHCR_DOCKERCONFIGJSON
