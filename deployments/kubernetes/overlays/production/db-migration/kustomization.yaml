apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../base/db-migration

images:
- name: ghcr.io/__GHCR_OWNER__/monolith-payment-gateway-grpc-quarkus/db-migration
  newName: ghcr.io/mamangrust/monolith-payment-gateway-grpc-quarkus/db-migration
  newTag: latest

patches:
- patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: migrate
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
        argocd.argoproj.io/sync-wave: "1"
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-pull-secret
  target:
    group: batch
    version: v1
    kind: Job
    name: migrate
