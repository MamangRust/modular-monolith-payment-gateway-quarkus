receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  prometheus:
    config:
      scrape_configs:
        - job_name: "kafka-exporter"
          scrape_interval: 5s
          static_configs:
            - targets: ["kafka-exporter:9308"]
        - job_name: "gateway-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["gateway:8080"]
        - job_name: "auth-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["auth:8092"]
        - job_name: "user-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["user:8091"]
        - job_name: "role-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["role:8086"]
        - job_name: "card-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["card:8084"]
        - job_name: "merchant-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["merchant:8085"]
        - job_name: "saldo-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["saldo:8087"]
        - job_name: "topup-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["topup:8088"]
        - job_name: "transaction-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["transaction:8089"]
        - job_name: "transfer-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["transfer:8090"]
        - job_name: "withdraw-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["withdraw:8093"]
        - job_name: "email-service"
          metrics_path: "/q/metrics"
          static_configs:
            - targets: ["email-service:8094"]

processors:
  batch:

exporters:
  otlp:
    endpoint: "jaeger:4317"
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "java_app"
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
    timeout: 10s

extensions:
  health_check:
  pprof:
  zpages:

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
