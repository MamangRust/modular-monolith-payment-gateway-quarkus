# Test configuration for auth module
quarkus.grpc.server.port=9012
quarkus.http.port=8092

# Disable actual DB for unit tests
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=test
quarkus.datasource.password=test
quarkus.datasource.reactive.url=postgresql://localhost:5432/test

# Mock Redis
quarkus.redis.hosts=redis://localhost:6379

# JWT Test Config
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://example-quarkus-opentelemetry.com
app.jwtExpirationMs=604800000
app.jwtRefreshExpirationMs=86400000

# Disable chaos for tests
quarkus.chaos.enabled=false

# Logging
quarkus.log.level=WARN
quarkus.log.category."com.sanedge".level=INFO
